name: Deploy Backlink Frontend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy source files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "src,public,package.json,package-lock.json,next.config.ts,tsconfig.json,postcss.config.mjs,eslint.config.mjs,next-env.d.ts,favicon.png"
          target: "/home/ubuntu/apps/backlink-fe"
          overwrite: true

      - name: Build and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /home/ubuntu/apps/backlink-fe
            npm ci --no-audit --no-fund
            # .env.production.local on the server holds the NEXT_PUBLIC_* values
            NODE_OPTIONS=--max-old-space-size=1536 npm run build
            pm2 restart backlink-frontend || PORT=3000 pm2 start npm --name backlink-frontend -- start
            pm2 save
